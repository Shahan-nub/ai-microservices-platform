events {}

http {

    upstream auth_service {
        server auth-service:8000;
    }

    upstream chat_service {
        server chat-service:8000;
    }

    upstream resume_service {
        server resume-service:8000;
    }

    upstream embedding_service {
        server embedding-service:8000;
    }

    upstream notification_service {
        server notification-service:8000;
    }

    server {

        listen 80;

        location /api/auth/ {

            proxy_pass http://auth_service/auth/;
            
        }

        location /api/chat/ {

            proxy_pass http://chat_service/chat/;

        }

        location /api/resume/ {

            proxy_pass http://resume_service/resume/;

        }

        location /api/embed/ {

            proxy_pass http://embedding_service/embed/;

        }

        location /api/notify/ {

            proxy_pass http://notification_service/notify/;

        }

    }
}