events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location /api/auth/ {
            set $backend auth-service;
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://$backend:8000;
        }

        location /api/chat/ {
            set $backend chat-service;
            rewrite ^/api/chat/(.*)$ /chat/$1 break;
            proxy_pass http://$backend:8000;
        }

        location /api/resume/ {
            set $backend resume-service;
            rewrite ^/api/resume/(.*)$ /resume/$1 break;
            proxy_pass http://$backend:8000;
        }

        location /api/embed/ {
            set $backend embedding-service;
            rewrite ^/api/embed/(.*)$ /embed/$1 break;
            proxy_pass http://$backend:8000;
        }

        location /api/notify/ {
            set $backend notification-service;
            rewrite ^/api/notify/(.*)$ /notify/$1 break;
            proxy_pass http://$backend:8000;
        }
    }
}
